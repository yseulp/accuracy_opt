benchmark:
  name: testcube_20
  random_seed: 0

geometry:
  type: testcube
  domain_dim: [20, 20, 20]
  offset: [5, 5, 5]

process:
  layer_height: 0.05
  exposure_time: 2.0
  atten_coef: 11.82
  sigma: 2.0
  I_max: 1.93
  E_crit: 0.97
  min_infl_factor: 0.001

initialization:
  type: target_scaled
  scale: 1.0

target_energy:
  type: attenuated_layers
  reference: initial_intensity
  scale: 0.5

metrics:
  - undercured_voxels
  - overcured_voxels
  - outside_energy
  - min_inside_energy
  - max_outside_energy
  - runtime_seconds
  - optimization_success
  - converged
  - iterations
  - gradient_norm

visualization:
  slice_y: 10

output:
  directory: results
  comparison_csv: comparison.csv
  save_intensity_arrays: true
  save_plots: true
